name: Build launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Rebuilds the project layout from the files in the repository, even if they
      # were uploaded flat (all in the root, without folders).
      - name: Organize project files
        run: |
          set -e
          J=launcher/src/main/java/dev/tvlauncher/home
          R=launcher/src/main/res/values
          M=launcher/src/main
          mkdir -p "$J" "$R" "$M"
          for f in MainActivity TileView GlowView HighlightView; do
            [ -f "$f.java" ] && mv -f "$f.java" "$J/$f.java" || true
          done
          [ -f config.xml ] && mv -f config.xml "$R/config.xml" || true
          [ -f styles.xml ] && mv -f styles.xml "$R/styles.xml" || true
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml "$M/AndroidManifest.xml" || true
          rm -f "build (1).gradle" download

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TvLauncher"
          include ':launcher'
          GRADLE

          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          GRADLE

          cat > launcher/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'dev.tvlauncher.home'
              compileSdk 34

              defaultConfig {
                  applicationId 'dev.tvlauncher.home'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
          }
          GRADLE

          echo "--- project layout"
          find . -path ./.git -prune -o -type f -not -path "./.github/*" -print | sort

      # Optional: the Outfit typeface (SIL Open Font License) for the clock.
      - name: Download Outfit font
        continue-on-error: true
        run: |
          mkdir -p launcher/src/main/assets
          curl -fsSL -o launcher/src/main/assets/Outfit.ttf "https://github.com/google/fonts/raw/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || rm -f launcher/src/main/assets/Outfit.ttf

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/build/outputs/apk/debug/*.apk
